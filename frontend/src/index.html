<main class="container min-vh-100 d-flex align-items-center py-5">
    <div class="container">

        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">PJW Node</h1>
            <p class="lead text-secondary">Gestione utenti e card</p>
        </div>

        <div class="row justify-content-center g-4">

            <!-- REGISTRAZIONE -->
            <div class="col-12 col-lg-6">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Registrazione</h2>
                            <p class="text-secondary mb-0">Crea un nuovo account</p>
                        </div>

                        <form id="registerForm" action="/register" method="POST">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nome" name="nome" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="cognome" class="form-label">Cognome</label>
                                    <input type="text" class="form-control" id="cognome" name="cognome" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="mail" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <label for="ruolo" class="form-label">Ruolo</label>
                                    <input type="text" class="form-control" id="ruolo" name="ruolo" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Registrati
                            </button>

                        </form>

                        <div id="result" class="alert alert-success d-none mt-3"></div>

                    </div>
                </div>
            </div>


            <!-- LOGIN -->
            <div class="col-12 col-lg-4">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <h2 class="fw-bold">Accesso</h2>
                            <p class="text-secondary mb-0">Accedi al tuo account</p>
                        </div>

                        <form id="loginForm" action="/login" method="POST">

                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="loginEmail" name="mail" required>
                            </div>

                            <div class="mb-4">
                                <label for="loginPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="loginPassword" name="password" required>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Accedi
                            </button>

                        </form>

                        <div id="loginResult" class="mt-3 text-center"></div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<script src="index.js"></script>
