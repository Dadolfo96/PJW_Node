
<main class="container min-vh-100 py-5">

    <div class="container">

        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">Lavagna Card</h1>
            <p class="lead text-secondary">Gestione delle card</p>
        </div>

        <!-- TABELLA CARD -->
        <div class="card shadow border-0 rounded-4 mb-4">
            <div class="card-body p-4 p-md-5">

                <h2 class="fw-bold mb-4">Tutte le card</h2>

                <table id="cards" class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Stato</th>
                            <th>Data creazione</th>
                            <th>Data aggiornamento</th>
                            <th>Titolo</th>
                            <th>Sottotitolo</th>
                            <th>Assegnatario</th>
                            <th>Responsabile</th>
                            <th>ID User Esecutore</th>
                            <th>Note</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>

            </div>
        </div>
            //crea nuiova card
        <div class="card shadow border-0 rounded-4 mb-4">
            <div class="card-body p-4 p-md-5">

                <h2 class="fw-bold mb-4">Crea nuova card</h2>

                <form id="createForm">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="createStato" class="form-label">Stato</label>
                            <select class="form-select" id="createStato" name="stato" required>
                                <option value="Pianificato">Pianificato</option>
                                <option value="In lavorazione">In lavorazione</option>
                                <option value="Completato">Completato</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="createTitolo" class="form-label">Titolo</label>
                            <input type="text" class="form-control" id="createTitolo" name="titolo" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="createSottotitolo" class="form-label">Sottotitolo</label>
                            <input type="text" class="form-control" id="createSottotitolo" name="sottotitolo">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="createAssegnatario" class="form-label">Assegnatario</label>
                            <input type="text" class="form-control" id="createAssegnatario" name="assegnatario" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="createResponsabile" class="form-label">Responsabile</label>
                            <input type="text" class="form-control" id="createResponsabile" name="responsabile" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="createIdUserEsecutore" class="form-label">ID User Esecutore</label>
                            <input type="number" class="form-control" id="createIdUserEsecutore" name="id_user_esecutore">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="createNote" class="form-label">Note</label>
                        <textarea class="form-control" id="createNote" name="note"></textarea>
                    </div>

                    <button type="submit" id="createButton" class="btn btn-primary">
                        Crea card
                    </button>

                </form>

                <div id="createResult" class="alert alert-success d-none mt-3"></div>

            </div>
        </div>       

        <!-- FIND BY ID -->
        <div class="card shadow border-0 rounded-4 mb-4">
            <div class="card-body p-4 p-md-5">

                <h2 class="fw-bold mb-4">Cerca card</h2>

                <form id="findForm">

                    <div class="mb-3">
                        <label for="id" class="form-label">ID card</label>
                        <input type="number" class="form-control" id="id" name="id" required>
                    </div>

                    <button type="submit" id="findButton" class="btn btn-primary">
                        Cerca
                    </button>

                </form>

                <div id="findResult" class="alert d-none mt-4"></div>

            </div>
        </div>
        <!-- UPDATE BY ID -->
        <div class="card shadow border-0 rounded-4 mb-4">
            <div class="card-body p-4 p-md-5">

                <h2 class="fw-bold mb-4">Modifica card</h2>

<!-- UPDATE BY ID -->

<div class="card shadow border-0 rounded-4 mb-4">
    <div class="card-body p-4 p-md-5">


    <h2 class="fw-bold mb-4">Modifica card</h2>

        <form id="updateForm">

            <div class="mb-3">
                <label for="updateId" class="form-label">ID card</label>
                <input type="number" class="form-control" id="updateId" name="id" required>
            </div>

            <div class="mb-3">
                <label for="updateStato" class="form-label">Stato</label>
                <select class="form-select" id="updateStato" name="stato" required>
                    <option value="Pianificato">Pianificato</option>
                    <option value="In lavorazione">In lavorazione</option>
                    <option value="Completato">Completato</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="updateTitolo" class="form-label">Titolo</label>
                <input type="text" class="form-control" id="updateTitolo" name="titolo">
            </div>

            <div class="mb-3">
                <label for="updateSottotitolo" class="form-label">Sottotitolo</label>
                <input type="text" class="form-control" id="updateSottotitolo" name="sottotitolo">
            </div>

            <div class="mb-3">
                <label for="updateAssegnatario" class="form-label">Assegnatario</label>
                <input type="text" class="form-control" id="updateAssegnatario" name="assegnatario">
            </div>

            <div class="mb-3">
                <label for="updateResponsabile" class="form-label">Responsabile</label>
                <input type="text" class="form-control" id="updateResponsabile" name="responsabile">
            </div>

            <div class="mb-3">
                <label for="updateIdUserEsecutore" class="form-label">ID User Esecutore</label>
                <input type="number" class="form-control" id="updateIdUserEsecutore" name="id_user_esecutore">
            </div>

            <div class="mb-4">
                <label for="updateNote" class="form-label">Note</label>
                <textarea class="form-control" id="updateNote" name="note"></textarea>
            </div>

            <button type="submit" id="updateButton" class="btn btn-warning">
                Modifica
            </button>

        </form>

        <div id="updateResult" class="alert d-none mt-4"></div>

    </div>


</div>


            </div>
        </div>

        <!-- DELETE BY ID -->
        <div id="deleteCard" class="card shadow border-0 rounded-4 mb-4">
            <div class="card-body p-4 p-md-5">

                <h2 class="fw-bold mb-4">Elimina card</h2>

                <form id="deleteForm">

                    <div class="mb-3">
                        <label for="deleteId" class="form-label">ID card</label>
                        <input type="number" class="form-control" id="deleteId" name="id" required>
                    </div>

                    <button type="submit" id="deleteButton" class="btn btn-danger">
                        Elimina
                    </button>

                </form>

            </div>
        </div>

        <div id="boardResult" class="alert d-none mt-4"></div>

    </div>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.3.3/js/dataTables.min.js"></script>

if (sessionStorage.getItem("ruolo") !== "Admin") {
    document.getElementById("deleteCard").hidden = true;
}
</script>
